<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <link rel="shortcut icon" href="./Images/logo.jpg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="news_articles.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>
<body>
   <!--Header start-->
    <header class="site-header">
      <div class="#logo">
        <a href="#home" target="_blank">
          <img
            src="./Images/logo.jpg"
            width="60px"
            alt="Aframa Mission School Logo"
          />
        </a>
      </div>
      <div>
        <nav>
          <ul>
            <li>
              <a href="#home"><i class="fa-solid fa-house"></i> Home</a>
            </li>
            <li>
              <a href="#About"><i class="fa-solid fa-circle-info"></i> About</a>
              <ul>
                <li>
                  <a href="#Management"
                    ><i class="fa-solid fa-users"></i> Our Management Team</a
                  >
                </li>
              </ul>
            </li>
            <li>
              <a href="#News"
                ><i class="fa-solid fa-newspaper"></i> News and Articles</a
              >
            </li>
            <li>
              <a href="#contact"
                ><i class="fa-solid fa-envelope"></i> Contact</a
              >
            </li>
          </ul>
        </nav>
      </div>

      <div>
        <button type="button" class="btn-primary">ADMISSION</button>
        <button type="button" class="btn-secondary">Join Us</button>
      </div>
    </header>
    <!--Main-->
    <main>
      <!--Main Hero-section-->
      <div class="box">
      <section class="hero-sect-box" 
      style="display: flex; justify-content: space-around,"
      id="about">
        <div class="hero-content" >
          <h1 data-aos="fade-in " data-aos-delay="200" data-aos-duration="2000">BLOGS <br>& <br>ARTICLES</h1>
          <div class="hero-buttons"data-aos="fade-right" data-aos-delay="400" data-aos-duration="3000">
            <i class="fa-solid fa-book fa-1x"></i>
            <span >Read</span>
          </div>
           <div class="hero-buttons" data-aos="fade-right" data-aos-delay="400" data-aos-duration="3000">
            <i class="fa-solid fa-person fa-1x"></i>
            <span >Explore</span>
          </div >
           <div class="hero-buttons" data-aos="fade-right" data-aos-delay="400" data-aos-duration="3000">
            <i class="fa-solid fa-smile fa-1x"></i>
            <span >Discover</span>
          </div><br>
          <p>Have an exciting moment whiles you are here.... enjoy your stay</p>
        </div>
      </section>
    </main>

   <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        once: false,
        duration: 800,
      });
    </script>
</body>
</html>
